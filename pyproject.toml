[build-system]
requires = ["setuptools>=83,<85"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[project]
name = "qff2026-s3-phase1"
version = "0.3.0"
description = "Architecture-aware quantum benchmark implementation"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.0,<3",
  "matplotlib>=3.8,<4",
  "scipy>=1.11,<2",
  "jupyter>=1,<2",
  "nbformat>=5.9,<6",
  "qiskit>=1.2,<2",
  "qiskit-aer>=0.15,<1"
]
