[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-ra"

[project]
name = "qff2026-s3-phase1"
version = "0.1.0"
description = "Qiskit Fall Fest 2026 Phase 1 architecture and S3 demonstration project"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.0",
  "matplotlib>=3.8",
  "networkx>=3.2",
  "scipy>=1.11",
  "jupyter>=1.0",
  "nbformat>=5.9"
]
