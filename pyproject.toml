[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-ra"
testpaths = ["tests"]

[project]
name = "qff2026-s3-phase1"
version = "0.2.0"
description = "Qiskit Fall Fest 2026 Phase 1 S3 architecture-aware benchmarking scaffold"
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.0,<3",
  "matplotlib>=3.8,<4",
  "scipy>=1.11,<2",
  "jupyter>=1,<2",
  "nbformat>=5.9,<6",
  "qiskit>=1.2,<2",
  "qiskit-aer>=0.15,<1"
]
