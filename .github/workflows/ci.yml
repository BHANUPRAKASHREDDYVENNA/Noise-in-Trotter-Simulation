name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qff-s3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10","3.11","3.12","3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-practice.txt
      - run: python -m pip install -r requirements-practice.txt
      - run: python -m pip check
      - run: python -m compileall -q src scripts tests
      - run: python -m pytest -q

  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-practice.txt
      - run: python -m pip install -r requirements-practice.txt
      - run: python scripts/build_notebook.py
      - run: python scripts/run_practice.py
      - run: python scripts/make_practice_figures.py
      - run: python scripts/run_bell_benchmark.py
      - run: python scripts/validate_submission.py --practice
      - uses: actions/upload-artifact@v7
        with:
          name: qff-s3-results
          path: |
            results/tables/
            results/figures/
            main.ipynb
          if-no-files-found: error
