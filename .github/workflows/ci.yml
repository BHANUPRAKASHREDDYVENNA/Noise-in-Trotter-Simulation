name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  MPLBACKEND: Agg
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify dependency health
        run: python -m pip check

      - name: Security audit
        run: python scripts/security_audit.py

      - name: Compile Python sources
        run: python -m compileall -q src scripts tests

      - name: Rebuild notebook
        run: python scripts/build_notebook.py

      - name: Verify generated notebook is committed
        run: git diff --exit-code -- main.ipynb

      - name: Verify notebook structure
        run: python scripts/verify_notebook.py

      - name: Collect tests
        run: python -m pytest --collect-only -q

      - name: Run tests
        run: python -m pytest -q -ra --strict-config --strict-markers

      - name: Run S3 practice benchmark
        run: python scripts/run_practice.py

      - name: Generate practice figures
        run: python scripts/make_practice_figures.py

      - name: Validate practice repository
        run: python scripts/validate_submission.py --practice

      - name: Verify generated practice artifacts are committed
        run: >-
          git diff --exit-code --
          results/tables/practice_ab_comparison.csv
          results/tables/practice_processor_A_metrics.csv
          results/tables/practice_processor_B_metrics.csv
          results/figures/practice_ab_performance.png
          results/figures/practice_architecture_tradeoffs.png

      - name: Final security audit
        run: python scripts/security_audit.py
