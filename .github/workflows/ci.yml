name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  MPLBACKEND: Agg

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-practice.txt

      - name: Install practice dependencies
        run: python -m pip install -r requirements-practice.txt

      - name: Verify dependency health
        run: python -m pip check

      - name: Security audit
        run: python scripts/security_audit.py

      - name: Compile Python sources
        run: python -m compileall -q src scripts tests

      - name: Rebuild notebook
        run: python scripts/build_notebook.py

      - name: Verify generated notebook is committed
        run: git diff --exit-code -- main.ipynb

      - name: Verify notebook structure
        run: python scripts/verify_notebook.py

      - name: Run tests
        run: pytest -q

      - name: Run Bell practice benchmark
        run: python scripts/run_bell_benchmark.py

      - name: Run S3 practice benchmark
        run: python scripts/run_practice.py

      - name: Generate practice figures
        run: python scripts/make_practice_figures.py

      - name: Validate practice repository
        run: python scripts/validate_submission.py --practice
