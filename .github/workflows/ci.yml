name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  MPLBACKEND: Agg
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11.17"
          cache: pip
          cache-dependency-path: |
            requirements-ci.lock
            requirements-quality.txt

      - name: Install pinned runtime/test dependencies
        run: python -m pip install -r requirements-ci.lock

      - name: Install pinned release-quality tooling
        run: python -m pip install -r requirements-quality.txt

      - name: Verify dependency health
        run: python -m pip check

      - name: Production release gate
        run: python scripts/release_gate.py --strict-git
