name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qff-s3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m compileall -q Phase1 Phase2
      - run: python -m pytest -q

  phase2-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Validate Processor D
        run: cd Phase2 && python check_processor_d.py processors/processor_D.json 4
      - name: Run Phase 2 Benchmark Suite
        run: cd Phase2 && python scripts/run_phase2_s3.py
      - name: Generate Publication Figures
        run: cd Phase2 && python scripts/make_phase2_figures.py
      - name: Run Phase 2 Pytest Suite
        run: cd Phase2 && python -m pytest -q
      - name: Validate Phase 1 Submission
        run: cd Phase1 && python scripts/validate_submission.py --practice
      - uses: actions/upload-artifact@v7
        with:
          name: qff-s3-phase2-results
          path: |
            Phase2/results/tables/
            Phase2/results/figures/
            Phase2/main.ipynb
          if-no-files-found: error
